# =============================================================================
# File:    01-secret.yaml
# Purpose: Stores PostgreSQL credentials as a Kubernetes Secret.
#
# What is a Secret?
#   A Secret is a Kubernetes resource for storing sensitive data such as
#   passwords, API keys, and tokens. It keeps credentials out of your
#   application code and Docker images.
#
# How are values encoded?
#   Values in the `data` block must be base64-encoded — this is NOT encryption,
#   just encoding. Kubernetes stores Secrets in etcd (the cluster database).
#   In a production cluster you would enable etcd encryption at rest and use
#   a secrets manager (e.g. Vault, AWS Secrets Manager) for additional security.
#   For a local learning cluster, base64 is sufficient.
#
# How to encode your own values:
#   echo -n "your-value" | base64
#   The -n flag prevents echo from adding a newline, which would corrupt the value.
#
# How Pods consume this Secret:
#   The Deployment manifest (03-deployment.yaml) references this Secret by name
#   and maps each key to an environment variable inside the container.
#   The app reads them with Sys.getenv() in global.R — never hardcoded.
#
# IMPORTANT: Do not commit real passwords to a public GitHub repo.
#   The values below are placeholders. Before deploying, replace them with your
#   own base64-encoded passwords, or use a tool like Sealed Secrets / SOPS
#   to encrypt Secrets before committing.
#
# Apply with:
#   kubectl apply -f k8s/postgres/01-secret.yaml
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name:      postgres-secret    # referenced by name in 03-deployment.yaml and 06-deployment.yaml
  namespace: field-logger       # must match the Namespace created in 00-namespace.yaml
  labels:
    app.kubernetes.io/name:      postgres
    app.kubernetes.io/component: database
type: Opaque                    # Opaque = arbitrary user-defined data (the most common Secret type)

# All values must be base64-encoded.
# To generate:  echo -n "your-value" | base64
#
# Current placeholder values decode to:
#   POSTGRES_USER     -> fielduser
#   POSTGRES_PASSWORD -> fieldpassword
#   POSTGRES_DB       -> fielddb
#
# Replace these before deploying to any environment accessible from the internet.
data:
  POSTGRES_USER:     ZmllbGR1c2Vy          # base64("fielduser")
  POSTGRES_PASSWORD: ZmllbGRwYXNzd29yZA==  # base64("fieldpassword")
  POSTGRES_DB:       ZmllbGRkYg==          # base64("fielddb")
